name: manual-report-in1290
version: "1"
description: >
  Manual Report DevInt Proof #2 (IN-1290) — golden snapshot vs candidate pipeline outputs.
  Declares WO, Dagster, and Postgres components in the sandbox boundary.

components:
  wo:
    type: wo
    description: Workflow orchestrator job payloads and statuses
  dagster:
    type: dagster
    description: AutoFOV, AutoGaps sensor, LISA materializations
  postgres_qa:
    type: postgres
    description: manual_report, boundary_result, gap rollups

datasets:
  golden:
    source: file
    path: golden/proof2.json
    key: manual_report_id
  candidate:
    source: file
    path: candidate/proof2.json
    key: manual_report_id

align:
  golden_key: manual_report_id
  candidate_key: manual_report_id

metrics:
  - name: driving_session_count
    golden: golden.driving_session_count
    candidate: candidate.driving_session_count
    fn: exact

  - name: autofov_tile_count
    golden: golden.autofov_tile_count
    candidate: candidate.autofov_tile_count
    fn: exact

  - name: autofov_postgres_written
    golden: golden.autofov_postgres_written
    candidate: candidate.autofov_postgres_written
    fn: exact

  - name: aggregated_fov_present
    golden: golden.aggregated_fov_wkt
    candidate: candidate.aggregated_fov_wkt
    fn: not_null

  - name: aggregated_fov_jaccard
    golden: golden.aggregated_fov_wkt
    candidate: candidate.aggregated_fov_wkt
    fn: jaccard
    threshold: 0.99

  - name: autogaps_gap_count
    golden: golden.gap_count
    candidate: candidate.gap_count
    fn: exact

  - name: lisa_dagster_success
    golden: golden.lisa_orchestration_status
    candidate: candidate.lisa_orchestration_status
    fn: exact
