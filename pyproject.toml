[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gavel-mcp"
version = "0.4.0"
description = "Gavel — collect evidence, compare to golden, emit verdict. MCP server for agentic pipeline validation."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Abhishek Jain" }]
dependencies = [
  "mcp>=1.12,<2",
  "pydantic>=2.8,<3",
  "pyyaml>=6.0,<7",
  "shapely>=2.0,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
]
live = [
  "psycopg[binary]>=3.2,<4",
]
tlc = ["duckdb>=1.1,<2"]

[project.scripts]
gavel = "gavel.cli:main"
gavel-mcp = "gavel.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/gavel"]

[tool.hatch.build.targets.wheel.force-include]
"sandboxes" = "gavel/sandboxes"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
