name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest --cov=gavel --cov-report=term-missing
      - name: Prove behavior through MCP
        run: python scripts/prove_it.py
      - name: Benchmark MCP boundary
        run: python scripts/benchmark_mcp.py --output benchmark-report.json --markdown "$GITHUB_STEP_SUMMARY"
      - name: Publish benchmark evidence
        uses: actions/upload-artifact@v4
        with:
          name: gavel-benchmark
          path: benchmark-report.json
          if-no-files-found: error
